<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>業務委託契約書 電子署名 | ありがとうエアコンお掃除専門店</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif; background:#f4f4f2; color:#222; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px 14px 40px; }
  h1 { font-size: 20px; text-align:center; margin: 10px 0 2px; }
  .sub { text-align:center; color:#666; font-size:12px; margin-bottom:14px; }
  .card { background:#fff; border-radius:12px; padding:18px 16px; margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .card h2 { font-size:15px; margin:0 0 10px; border-left:4px solid #1f6f4a; padding-left:8px; }
  label { display:block; font-size:13px; font-weight:600; margin:10px 0 4px; }
  input[type=text] { width:100%; padding:12px; font-size:16px; border:1px solid #bbb; border-radius:8px; }
  .fee-badge { display:inline-block; background:#eef6f1; color:#1f6f4a; border:1px solid #1f6f4a; border-radius:999px; padding:3px 12px; font-size:13px; font-weight:700; }
  .contract { font-family:'Hiragino Mincho ProN','Yu Mincho',serif; font-size:13.5px; line-height:1.8; max-height:52vh; overflow-y:auto; border:1px solid #ddd; border-radius:8px; padding:14px; background:#fffdf7; }
  .contract h3 { font-size:15px; text-align:center; margin:0 0 10px; }
  .contract .head { font-weight:700; margin-top:10px; }
  .contract p { margin:0; text-align:justify; }
  .party { font-size:14px; line-height:1.9; }
  #pad { width:100%; height:180px; border:2px solid #888; border-radius:8px; background:#fff; touch-action:none; }
  .row { display:flex; gap:10px; margin-top:10px; }
  button { flex:1; padding:14px; font-size:16px; border-radius:10px; border:none; cursor:pointer; }
  .btn-clear { background:#eee; color:#333; flex:0 0 110px; }
  .btn-sign { background:#1f6f4a; color:#fff; font-weight:700; }
  .btn-sign:disabled { background:#9db8ab; }
  .agree { display:flex; gap:8px; align-items:flex-start; margin:14px 0 4px; font-size:14px; }
  .agree input { width:20px; height:20px; margin-top:1px; }
  .note { font-size:12px; color:#666; }
  #done { display:none; text-align:center; padding:30px 10px; }
  #done .big { font-size:20px; font-weight:700; color:#1f6f4a; margin-bottom:8px; }
  .err { color:#c0392b; font-size:13px; min-height:18px; margin-top:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>業務委託契約書</h1>
  <div class="sub">ありがとうエアコンお掃除専門店（エイムポイント合同会社）との業務委託契約の電子署名ページです</div>

  <div id="form-area">
    <div class="card">
      <h2>署名される方（乙）の情報</h2>
      <div>契約の種類： <span class="fee-badge" id="fee-badge"></span></div>
      <label for="name">氏名（乙）<span style="color:#c0392b"> *</span></label>
      <input type="text" id="name" placeholder="例：山田 太郎" autocomplete="name">
      <label for="address">住所（乙）<span style="color:#c0392b"> *</span></label>
      <input type="text" id="address" placeholder="例：東京都台東区東上野3-15-14" autocomplete="street-address">
      <div class="note">入力した氏名は契約書の冒頭と署名欄に反映されます。</div>
    </div>

    <div class="card">
      <h2>契約内容の確認</h2>
      <div class="contract" id="contract"></div>
      <label class="agree"><input type="checkbox" id="agree"><span>契約内容を確認し、同意のうえ署名します</span></label>
    </div>

    <div class="card">
      <h2>署名欄</h2>
      <div class="party">
        甲：エイムポイント合同会社<br>
        〒220-0004　神奈川県横浜市西区北幸1-11-1 水信ビル7階<br>
        代表社員　三浦 公嗣<br><br>
        乙：<span id="sign-address"></span><br>
        氏名：<span id="sign-name"></span><br>
        署名日：<span id="sign-date"></span>
      </div>
      <div style="height:10px"></div>
      <canvas id="pad"></canvas>
      <div class="note">枠内に指またはマウスでご署名ください。</div>
      <div class="row">
        <button type="button" class="btn-clear" id="clear">クリア</button>
        <button type="button" class="btn-sign" id="submit">署名して送信する</button>
      </div>
      <div class="err" id="err"></div>
    </div>
  </div>

  <div id="done" class="card">
    <div class="big">署名が完了しました</div>
    <div>ご署名ありがとうございました。<br>内容は管理表に記録されました。この画面は閉じて大丈夫です。</div>
  </div>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzhcHK14SWYo-gBAQFSpCUfLj6G7O7uuwq8qLV6CkRWjfyEvYhN73ezIruzwiObzy_4/exec";
const PARAS = [{"k": "title", "t": "業務委託契約書"}, {"k": "body", "t": "エイムポイント合同会社（以下、「甲」という。）と　　（以下、「乙」という。）とは、甲が運営する「ありがとうエアコンお掃除専門店」（以下、「本事業」という。）に関連する業務を乙に委託することを約した。"}, {"k": "head", "t": "（業務の委託）"}, {"k": "body", "t": "第1条　甲は、乙に対し、本事業に関して以下の業務（以下、「本件業務」という。）を委託する。"}, {"k": "body", "t": "①　甲が受注した本件業務の現場作業業務"}, {"k": "body", "t": "②　①に関連するサービス利用者との連絡調整業務"}, {"k": "body", "t": "③　現場作業終了時のクレジットカード決済に関する業務"}, {"k": "body", "t": "④　その他上記事項に付随する一切の業務"}, {"k": "body", "t": "⑤　自身で清掃業を営んでいる場合、乙は、月に最低10日間は本件業務に従事するためのスケジュールを確保するものとする。現場数では、月に最低30〜35現場の業務を遂行するものとする。"}, {"k": "body", "t": "⑥　乙は本件業務を行うにあたって、第4条の甲が行う研修通りに業務を遂行するものとする。"}, {"k": "body", "t": "⑦　⑤⑥に違反した場合、違約金として乙は甲に100万円の支払義務を負うものとする。"}, {"k": "head", "t": "（甲の業務）"}, {"k": "body", "t": "第2条　甲は本事業を円滑に運営するために、乙に以下を提供する。"}, {"k": "body", "t": "①　本事業に関連する広告、営業集客、受注管理、カスタマーサービス、日本一の口コミノウハウ、不労所得獲得ノウハウ"}, {"k": "body", "t": "②　公正な現場振分け"}, {"k": "body", "t": "③　請求書自動作成システムの利用"}, {"k": "body", "t": "④　現場作業に必要な備品を割安で提供すること"}, {"k": "head", "t": "（必要備品等の用意）"}, {"k": "body", "t": "第3条　乙は本件業務を開始するにあたって、自己の責任で本件業務に必要な備品等を用意する。"}, {"k": "body", "t": "＜必要備品等の例示＞"}, {"k": "body", "t": "①　自動車及び自動車の運行及び維持に関する諸経費"}, {"k": "body", "t": "②　本件業務の遂行に必要な道具、洗剤、消耗品等"}, {"k": "head", "t": "（研修）"}, {"k": "body", "t": "第4条　乙は、本件業務の遂行にあたって、甲が行う研修を受講しなければならない。"}, {"k": "body", "t": "①　オンライン研修"}, {"k": "body", "t": "②　実務研修　1日（場所及び方法は甲が別途指定する。）"}, {"k": "body", "t": "③　現場同行研修　5日（場所及び方法は甲が別途指定する。）"}, {"k": "body", "t": "2　前項に規定する研修の受講料として、乙は甲に@@FEE@@を支払うものとし、また業務研修中の業務委託料の支払いは行わない。"}, {"k": "body", "t": "※研修期間中、もしくは研修終了後、乙が500現場を終えず途中で辞退した場合、乙は甲に100万円の支払義務を負うものとする。"}, {"k": "body", "t": "3　規約遵守"}, {"k": "body", "t": "乙は、甲が定期的に実施する規約遵守教育を受講し、最新の規約とガイドラインに従って業務を遂行する義務がある。新規採用者及び再雇用者は、業務開始前に規約遵守教育を受講することを必須とし、継続的な教育および再教育にも参加すること。"}, {"k": "body", "t": "4　直接取引の禁止について"}, {"k": "body", "t": "乙は、各種ポータルサイトを通じて行われた取引において、顧客との直接取引を避けるものとし、再度の予約や取引も同様に各種ポータルサイトを介して行うことを徹底する。また、直接取引の誘導や推奨は厳禁とし、違反した場合は違約金が発生することを認識すること。"}, {"k": "head", "t": "（業務委託料）"}, {"k": "body", "t": "第5条　甲は、乙に対し、本契約に基づく業務委託料として、現場ごとの売上の内45％を本部経費として控除した残額の中から、委託契約者の下記別表の割合に応じた金額を業務委託料として支払う。"}, {"k": "body", "t": "2　歩合については、閑散期と繁忙期の歩合が変動する。"}, {"k": "body", "t": "3　閑散期には事務経費として、案件によっては1件500円〜900円を徴収する。"}, {"k": "body", "t": "4　口コミ、ライン、メルマガの取得数による歩合率変動：乙が業務を行うにあたって取得した口コミ、ライン、メルマガの数に基づき、歩合率が変動することを認識し、これに従って歩合が決定されるものとする。"}, {"k": "body", "t": "＜本部案件の場合＞"}, {"k": "body", "t": "甲が直接乙にエアコン清掃業務を委託する場合"}, {"k": "body", "t": "適用事項　距離別報酬割合"}, {"k": "body", "t": "①　70%（自宅から1km未満）"}, {"k": "body", "t": "②　72%（自宅から1km以上5km未満）"}, {"k": "body", "t": "③　73%（自宅から5km以上10km未満）"}, {"k": "body", "t": "④　75%（自宅から10km以上20km未満）"}, {"k": "body", "t": "⑤　78%（自宅から20km以上30km未満）"}, {"k": "body", "t": "⑥　80%（自宅から30km以上50km未満）"}, {"k": "body", "t": "⑦　85%（自宅から50km以上100km未満）"}, {"k": "body", "t": "5　業務委託料の支払時期に際して第4条第2項の研修受講料が未払である場合、甲は、乙に対し、毎月、未払研修受講料額に満つるまで、前3項の規定によって乙に支払うべき業務委託料から5%を相殺し、その残額を支払う。ただし、甲の許諾により、研修受講料の支払を猶予することができる。"}, {"k": "body", "t": "6　口コミ依頼ガイドライン"}, {"k": "body", "t": "乙は、作業完了後にのみ口コミの依頼を行うものとし、作業中や支払い前に口コミを依頼することは厳禁とする。また、口コミ依頼は、顧客に対して自由な感想や意見を尊重する形で行い、具体的な評価やコメントを指定することはできない。乙は、口コミ依頼の際に「5つ星をお願いします」や「高評価を付けてください」といった表現を使用しない。"}, {"k": "head", "t": "（育成委託料）"}, {"k": "body", "t": "第6条　甲が第4条に定める業務研修を乙以外の者に行うにあたって、乙がその業務研修の指導を行った場合には、甲は、第5条に定める業務委託料の他、乙に育成指導者としての育成委託料を支払う。"}, {"k": "body", "t": "育成委託料は、乙以外の本事業の委託者が受け取る業務委託料のうち0.25〜4%とし、その割合は、乙の指導実績及び乙以外の本事業の委託者の作業水準に応じて甲が評価して定める。"}, {"k": "head", "t": "（請求書の発行及び委託料の支払い）"}, {"k": "body", "t": "第7条　乙は、毎月月末に、甲が提供する請求書自動作成システムを利用して、甲に請求書を発行する。"}, {"k": "body", "t": "2　甲は、前項の規定により発行された請求金額を請求翌月の15日〜20日の間に、乙が指定する預金口座宛に振込み送金する方法にて支払うものとする。なお、振込手数料は乙の負担とする。"}, {"k": "head", "t": "（「ありがとうシステム」利用の場合）"}, {"k": "body", "t": "第8条　乙は、甲の提供する「ありがとうシステム」によって業務を受注した場合、その報酬受領後、甲に対して、システム利用料として、その税込報酬額の2%（税込）を支払う義務を負う。"}, {"k": "body", "t": "乙は、甲に対して、毎月末日までのシステム利用料の合計額を、翌月10日までに支払う。"}, {"k": "head", "t": "（契約期間）"}, {"k": "body", "t": "第9条　本契約の期間は、本契約締結の日から1年間とする。"}, {"k": "body", "t": "2　契約満了の2週間前迄に、甲又は乙から書面による解約の申し出のない場合は、本契約は1年間自動更新されるものとし、以後も同様とする。"}, {"k": "body", "t": "3　甲は、前2項の定めに関わらず、2週間の予告期間をもって本契約を任意に解約することができる。"}, {"k": "head", "t": "（善管注意義務・再委託）"}, {"k": "body", "t": "第10条　乙は、関係諸法令を遵守し、甲と協力の上、甲のために善良なる管理者の注意をもって本契約に基づく業務を遂行する。"}, {"k": "body", "t": "2　乙は、甲の書面による承諾がある場合に限り、乙の責任において、委託業務の全部又は一部を第三者に行わせることができる。"}, {"k": "head", "t": "（経費の支給）"}, {"k": "body", "t": "第11条　乙が、本契約に基づく業務遂行のために、第3条に規定する必要備品等以外の経費を必要とする場合は、その都度、甲乙間の協議により、負担者及び支払方法を書面にて決定するものとする。"}, {"k": "head", "t": "（損害賠償）"}, {"k": "body", "t": "第12条　甲及び乙は、故意又は過失により、相手方に損害を与えた場合、その損害を賠償するものとする。"}, {"k": "body", "t": "2　損害賠償と違約金の明確化"}, {"k": "body", "t": "乙が中抜き取引を行った場合、直近6ヶ月間の利用料金の5倍、またはお客様から受領した金額の5倍のいずれか高い金額を違約金として甲に支払う義務がある。また、その他の規約違反により甲または顧客に損害を与えた場合、乙はその損害を賠償する義務がある。"}, {"k": "head", "t": "（免責事項）"}, {"k": "body", "t": "第13条　甲及び乙は、火災、震災、水害等の天災による場合、盗難等第三者による加害又はその他自己の責に帰すべからざる事由により相手方が被った損害について、自己の加入する保険で支払われるものを除き、その責を負わないものとする。"}, {"k": "head", "t": "（契約の解除）"}, {"k": "body", "t": "第14条　甲及び乙は、相手方について次の各号に該当する事由が生じた場合、本契約を解除することができる。"}, {"k": "body", "t": "①　監督官庁から停止又は取り消し処分を受けたとき。"}, {"k": "body", "t": "②　破産手続開始、民事再生手続開始、会社更生手続開始、特別清算手続開始の申立てを受け、又は自ら申立てを行ったとき。"}, {"k": "body", "t": "③　資産又は信用状態に重大な変化が生じ、本契約に基づく債務の履行が困難になるおそれがあると認められるとき。"}, {"k": "body", "t": "④　故意又は過失により相手方の信用を失墜させるような行為があったとき。"}, {"k": "body", "t": "⑤　公序良俗に反し、その他著しい不信の行為があったとき。"}, {"k": "body", "t": "⑥　本項各号のほか本契約に定める条項に違反し、相手方に対し催告したにもかかわらず当該違反が是正されないとき。"}, {"k": "body", "t": "⑦　本条に従い本契約を解除された被解除者は、相手方に対し、契約解除により相手方が被った損害を賠償する。"}, {"k": "body", "t": "⑧　本条に従い乙により本契約が解除された場合、乙は、甲に対して受領済みの業務委託料の返還を要しない。"}, {"k": "head", "t": "（秘密保持義務）"}, {"k": "body", "t": "第15条　乙は、本契約の遂行により知り得た甲の運営に関する一切の情報（ノウハウ等）を、甲の事前の書面による承諾を得ないで第三者（ただし、本件機密情報を知る合理的必要のある自己の従業員及び法律上守秘義務を負う専門家を除く。）に開示又は漏洩してはならず、本契約の遂行のためのみ使用するものとし、他の目的に使用してはならない。"}, {"k": "body", "t": "2　顧客情報の取り扱いの明確化："}, {"k": "body", "t": "乙は、顧客情報を適切に管理し、顧客の同意なしに第三者に共有しないものとする。顧客情報は業務の遂行に必要な範囲でのみ使用し、目的外利用を行ってはならない。また、顧客情報の漏洩が発生した場合、速やかに甲に報告し、必要な対策を講じること。"}, {"k": "body", "t": "乙は、本契約の遂行により知り得た甲の運営に関する一切の情報（ノウハウ等）を漏洩した場合は、乙は甲に100万円（税別）の損害賠償金を支払うことを約した。"}, {"k": "head", "t": "（個人情報保護）"}, {"k": "body", "t": "第16条　乙は、個人情報を取り扱う場合には、個人情報の保護に関する法律及び本契約の定めを遵守して、本契約の目的の範囲において個人情報を取り扱うものとし、本契約の目的以外に、これを取り扱ってはならない。"}, {"k": "head", "t": "（反社会的勢力の排除）"}, {"k": "body", "t": "第17条　甲及び乙は、相手方当事者に対し、本契約締結時において次の各号の事項を互いに確約し、将来に渡って同様であることを互いに誓約する。"}, {"k": "body", "t": "①　自らが、暴力団、暴力団関係企業、総会屋若しくはこれらに準ずる者またはその構成員（以下総称して「反社会的勢力」という。）ではないこと。"}, {"k": "body", "t": "②　自らの役員（業務を執行する社員、取締役、執行役またはこれらに準ずる者をいう。）が反社会的勢力ではないこと。"}, {"k": "body", "t": "③　反社会的勢力に自己の名義を利用させ、この契約を締結するものでないこと。"}, {"k": "body", "t": "④　自ら又は第三者を利用して、次の行為をしないこと"}, {"k": "body", "t": "ア　相手方に対する脅迫的な言動または暴力を用いる行為"}, {"k": "body", "t": "イ　偽計または威力を用いて相手方の業務を妨害し、または信用を棄損する行為"}, {"k": "body", "t": "2　甲及び乙のいずれかが、前項の確約に違反した場合、相手方は、何らの催告を要せずに本契約を解除することができる。"}, {"k": "body", "t": "3　本条の規定によりこの契約が解除された場合には、被解除当事者は解除当事者に対して、その被った損害を賠償する。"}, {"k": "head", "t": "（契約上の地位の移転等の禁止）"}, {"k": "body", "t": "第18条　甲及び乙は、相手方当事者の事前の書面による承諾を得ずに、第三者に対し、本契約に基づく権利又は義務について、その全部又は一部を譲渡若しくは移転し、又は第三者のための担保に供する等の一切の処分をしてはならない。"}, {"k": "head", "t": "（契約終了後の権利義務）"}, {"k": "body", "t": "第19条　本契約終了後も、乙は、第14条、第15条所定の義務を負担する。"}, {"k": "body", "t": "2　乙は、本契約終了後1年間、本件終了時に甲が本件業務を運営する都道府県内において、エアコン清掃業を営み、または、エアコン清掃業を営む事業者の被用者となってはならない。"}, {"k": "body", "t": "3　乙が前項に違反した場合、乙がエアコン清掃業を営み、または、エアコン清掃業を営む被用者になったことによって得た収入は、その相当額を甲の損害とみなし、乙は甲に対してこれを賠償する義務を負う。"}, {"k": "body", "t": "4　第1条、第4条、第15条により、乙が100万円の支払い義務を負う場合、乙は、甲に対して、本契約終了後1か月以内に、未払金から既払い分を除いた金額を支払う。"}, {"k": "head", "t": "（合意管轄）"}, {"k": "body", "t": "第20条　甲及び乙は、本契約に関し裁判上の紛争が生じたときは、甲の本店所在地を管轄する地方裁判所又は簡易裁判所を専属的合意管轄裁判所とすることに合意する。"}, {"k": "head", "t": "（協議）"}, {"k": "body", "t": "第21条　甲及び乙は、本契約に定める事項の解釈について疑義が生じた場合又は本契約に定めのない事項が生じた場合、信義誠実の原則に基づき、相互に協議して解決を図るものとする。"}, {"k": "body", "t": "本契約の成立を証するため、甲及び乙記名押印または電子サインの上電子保管する。"}, {"k": "sign", "t": "　　年　　月　　日"}, {"k": "sign", "t": "甲：エイムポイント合同会社"}, {"k": "sign", "t": "〒220-0004"}, {"k": "sign", "t": "神奈川県横浜市西区北幸1-11-1　水信ビル7階"}, {"k": "sign", "t": "代表社員　三浦　公嗣　　印"}, {"k": "sign", "t": "乙："}, {"k": "sign", "t": "住所："}, {"k": "sign", "t": "氏名：　　　　　　　　　　　　　　印"}];
const params = new URLSearchParams(location.search);
const fee = params.get('fee') === '45000' ? '¥45,000（税込）' : '¥38,500（税込）';
document.getElementById('fee-badge').textContent = '研修受講料 ' + fee + ' 版';

const nameEl = document.getElementById('name');
const addrEl = document.getElementById('address');
function renderContract() {
  const nm = nameEl.value.trim() || '　　';
  let out = '';
  for (const p of PARAS) {
    let t = p.t.split('@@FEE@@').join(fee);
    t = t.replace(/エイムポイント合同会社（以下、「甲」という。）と　　（以下、「乙」という。）/,
                  'エイムポイント合同会社（以下、「甲」という。）と ' + nm + '（以下、「乙」という。）');
    t = t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
    if (p.k === 'title') out += '<h3>' + t + '</h3>';
    else if (p.k === 'head') out += '<p class="head">' + t + '</p>';
    else if (p.k === 'sign') out += '';
    else out += '<p>' + t + '</p>';
  }
  out += '<p style="margin-top:12px">本契約の成立を証するため、甲及び乙記名押印または電子サインの上電子保管する。</p>';
  document.getElementById('contract').innerHTML = out;
  document.getElementById('sign-name').textContent = nameEl.value.trim();
  document.getElementById('sign-address').textContent = addrEl.value.trim();
}
nameEl.addEventListener('input', renderContract);
addrEl.addEventListener('input', renderContract);
const today = new Date();
document.getElementById('sign-date').textContent = today.getFullYear() + '年' + (today.getMonth()+1) + '月' + today.getDate() + '日';
renderContract();

// 署名パッド
const pad = document.getElementById('pad');
const ctx = pad.getContext('2d');
let drawing = false, dirty = false, last = null;
function fitPad() {
  const r = pad.getBoundingClientRect();
  const img = dirty ? pad.toDataURL() : null;
  pad.width = r.width * 2; pad.height = 360;
  ctx.lineWidth = 3.2; ctx.lineCap = 'round'; ctx.strokeStyle = '#1a1a2e';
  if (img) { const i = new Image(); i.onload = () => ctx.drawImage(i, 0, 0, pad.width, pad.height); i.src = img; }
}
window.addEventListener('resize', fitPad); fitPad();
function pos(e) { const r = pad.getBoundingClientRect(); return { x: (e.clientX - r.left) * (pad.width / r.width), y: (e.clientY - r.top) * (pad.height / r.height) }; }
pad.addEventListener('pointerdown', e => { drawing = true; last = pos(e); pad.setPointerCapture(e.pointerId); });
pad.addEventListener('pointermove', e => { if (!drawing) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; dirty = true; });
pad.addEventListener('pointerup', () => drawing = false);
document.getElementById('clear').addEventListener('click', () => { ctx.clearRect(0, 0, pad.width, pad.height); dirty = false; });

document.getElementById('submit').addEventListener('click', async () => {
  const err = document.getElementById('err');
  const name = nameEl.value.trim(), address = addrEl.value.trim();
  if (!name) { err.textContent = '氏名を入力してください。'; return; }
  if (!address) { err.textContent = '住所を入力してください。'; return; }
  if (!document.getElementById('agree').checked) { err.textContent = '契約内容への同意にチェックを入れてください。'; return; }
  if (!dirty) { err.textContent = '署名欄にご署名ください。'; return; }
  err.textContent = '';
  const btn = document.getElementById('submit');
  btn.disabled = true; btn.textContent = '送信中…';
  const payload = { name, address, fee, signature: pad.toDataURL('image/png'), ua: navigator.userAgent };
  try {
    await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload) });
    document.getElementById('form-area').style.display = 'none';
    document.getElementById('done').style.display = 'block';
    window.scrollTo(0, 0);
  } catch (e) {
    err.textContent = '送信に失敗しました。電波の良い場所でもう一度お試しください。';
    btn.disabled = false; btn.textContent = '署名して送信する';
  }
});
</script>
